<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel do Atendente</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 min-h-screen p-4">
    <div class="max-w-7xl mx-auto">
      <div id="loginPanel" class="max-w-md mx-auto bg-white rounded-2xl shadow-lg p-6 mt-10">
        <h1 class="text-2xl font-bold text-slate-800 mb-2">Login do atendente</h1>
        <p class="text-slate-600 mb-2">Acesse o painel de atendimento.</p>
        <p class="text-sm text-amber-700 mb-6">Modo em memória: os atendimentos serão apagados quando o servidor for reiniciado.</p>

        <form id="loginForm" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">E-mail</label>
            <input id="agentEmail" type="email" required class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500" />
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
            <input id="agentPassword" type="password" required class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500" />
          </div>

          <button type="submit" class="w-full bg-sky-600 text-white py-3 rounded-lg font-semibold hover:bg-sky-700 transition-colors">
            Entrar
          </button>
        </form>
      </div>

      <div id="dashboardPanel" class="hidden">
        <div class="flex justify-between items-center mb-6">
          <div>
            <p class="text-sm text-sky-700 uppercase tracking-wide font-bold">Painel interno</p>
            <h1 class="text-3xl font-bold text-slate-800">Multi-atendimento</h1>
          </div>
          <button id="logoutBtn" class="bg-slate-800 text-white px-4 py-2 rounded-lg hover:bg-slate-700">Sair</button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <section class="bg-white rounded-2xl p-4 shadow-md">
            <div class="flex items-center justify-between mb-3">
              <h2 class="text-lg font-bold text-slate-800">Aguardando</h2>
              <span id="waitingCount" class="bg-yellow-100 text-yellow-700 px-2 py-1 rounded-full text-xs font-semibold">0</span>
            </div>
            <div id="waitingList" class="space-y-3"></div>
          </section>

          <section class="bg-white rounded-2xl p-4 shadow-md">
            <div class="flex items-center justify-between mb-3">
              <h2 class="text-lg font-bold text-slate-800">Meus atendimentos</h2>
              <span id="activeCount" class="bg-blue-100 text-blue-700 px-2 py-1 rounded-full text-xs font-semibold">0</span>
            </div>
            <div id="activeList" class="space-y-3"></div>
          </section>

          <section class="bg-white rounded-2xl p-4 shadow-md">
            <div class="flex items-center justify-between mb-3">
              <h2 class="text-lg font-bold text-slate-800">Concluídos</h2>
              <span id="closedCount" class="bg-slate-200 text-slate-700 px-2 py-1 rounded-full text-xs font-semibold">0</span>
            </div>
            <div id="closedList" class="space-y-3"></div>
          </section>
        </div>
      </div>
    </div>

    <div id="chatDrawer" class="fixed right-4 bottom-4 w-[420px] bg-white shadow-2xl rounded-2xl overflow-hidden hidden border border-slate-200">
      <div class="bg-sky-600 text-white p-3 flex justify-between items-center">
        <div>
          <p class="text-xs uppercase tracking-wide opacity-80">Conversa</p>
          <h3 id="chatTitle" class="font-bold">Ticket</h3>
        </div>
        <button id="closeChatDrawer" class="text-white font-bold">×</button>
      </div>

      <div id="drawerMessages" class="h-64 overflow-y-auto p-3 space-y-2 bg-slate-50"></div>

      <div class="p-3 border-t border-slate-200">
        <form id="agentChatForm" class="flex gap-2">
          <input id="agentMessageInput" type="text" class="flex-1 border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500" placeholder="Mensagem..." />
          <button type="submit" class="bg-sky-600 text-white px-3 py-2 rounded-lg font-semibold hover:bg-sky-700">Enviar</button>
        </form>
        <button id="finishTicketBtn" class="mt-3 w-full bg-red-600 text-white py-2 rounded-lg font-semibold hover:bg-red-700">Encerrar atendimento</button>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/admin.js"></script>
  </body>
</html>
