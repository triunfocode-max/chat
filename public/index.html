<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atendimento Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      }
    </style>
  </head>
  <body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-4xl bg-white shadow-xl rounded-2xl overflow-hidden">
      <div id="formPanel" class="p-6 md:p-8">
        <h1 class="text-2xl font-bold text-slate-800 mb-4">Solicitar atendimento</h1>
        <p class="text-slate-600 mb-2">Preencha os dados abaixo e nossa equipe responderá em seguida.</p>
        <p class="text-sm text-amber-700 mb-6">Modo em memória: os atendimentos serão apagados quando o servidor for reiniciado.</p>

        <form id="customerForm" class="grid gap-4 md:grid-cols-2">
          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-slate-700 mb-1">Nome completo</label>
            <input id="fullName" name="fullName" type="text" required class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500" />
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Função / Cargo</label>
            <input id="roleJob" name="roleJob" type="text" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500" />
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Telefone</label>
            <input id="phone" name="phone" type="tel" required class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500" placeholder="(00) 00000-0000" />
          </div>

          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-slate-700 mb-1">Setor / Departamento</label>
            <select id="departmentId" name="departmentId" required class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500">
              <option value="">Selecione</option>
            </select>

            <div id="customDepartmentWrap" class="hidden mt-3">
              <label class="block text-sm font-medium text-slate-700 mb-1">Digite o setor / departamento que não aparece</label>
              <input id="customDepartment" type="text" placeholder="Ex.: TI, Logística, Jurídico" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500" />
            </div>
          </div>

          <div class="md:col-span-2">
            <button type="submit" class="w-full bg-sky-600 text-white py-3 rounded-lg font-semibold hover:bg-sky-700 transition-colors">
              Iniciar atendimento
            </button>
          </div>
        </form>
      </div>

      <div id="chatPanel" class="hidden p-6 md:p-8 bg-slate-50">
        <div class="flex justify-between items-center mb-4">
          <div>
            <p class="text-xs uppercase tracking-wide text-sky-700 font-semibold">Atendimento</p>
            <h2 class="text-xl font-bold text-slate-800">Ticket #<span id="ticketIdLabel">-</span></h2>
          </div>
          <div id="statusBadge" class="px-3 py-1 rounded-full text-xs font-semibold bg-yellow-100 text-yellow-700">Aguardando</div>
        </div>

        <div id="chatMessages" class="h-80 overflow-y-auto bg-white border border-slate-200 rounded-xl p-4 space-y-3 mb-4"></div>

        <form id="chatForm" class="flex gap-2">
          <input id="messageInput" type="text" placeholder="Digite sua mensagem..." maxlength="1000" class="flex-1 border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500" />
          <button type="submit" class="bg-sky-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-sky-700 transition-colors">Enviar</button>
        </form>
      </div>
    </div>
  </body>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
</html>
